<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d">
<title id="t">FARUKHV animated developer interface</title><desc id="d">Animated terminal-style identity header for Faruk.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".48" stop-color="#3FB950"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163244" stroke-width="1" opacity=".28"/></pattern>
  <clipPath id="c1"><rect x="0" y="0" width="0" height="26"><animate attributeName="width" values="0;630;630" keyTimes="0;.72;1" dur="2.4s" begin="2.1s" fill="freeze"/></rect></clipPath>
</defs>
<rect width="1200" height="310" rx="22" fill="#071018"/><rect x="1" y="1" width="1198" height="308" rx="21" fill="none" stroke="#244258"/><rect width="1200" height="310" rx="22" fill="url(#grid)"/>
<circle cx="28" cy="28" r="4" fill="#FF7B72"/><circle cx="46" cy="28" r="4" fill="#D29922"/><circle cx="64" cy="28" r="4" fill="#3FB950"/>
<text x="91" y="33" font-family="monospace" font-size="12" fill="#708799">farukhv://identity</text>
<text x="1035" y="33" font-family="monospace" font-size="11" fill="#22D3EE">LIVE INTERFACE</text><circle cx="1166" cy="28" r="4" fill="#3FB950"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></circle>

<g font-family="monospace" font-size="13">
 <text x="42" y="77" fill="#3FB950" opacity="0">[ OK ] booting identity<animate attributeName="opacity" values="0;1;1" keyTimes="0;.1;1" dur=".55s" begin=".1s" fill="freeze"/></text>
 <text x="42" y="101" fill="#3FB950" opacity="0">[ OK ] mounting engineering<animate attributeName="opacity" values="0;1;1" keyTimes="0;.1;1" dur=".55s" begin=".55s" fill="freeze"/></text>
 <text x="42" y="125" fill="#3FB950" opacity="0">[ OK ] accessibility layer<animate attributeName="opacity" values="0;1;1" keyTimes="0;.1;1" dur=".55s" begin="1s" fill="freeze"/></text>
 <text x="42" y="149" fill="#3FB950" opacity="0">[ OK ] secure systems<animate attributeName="opacity" values="0;1;1" keyTimes="0;.1;1" dur=".55s" begin="1.45s" fill="freeze"/></text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".45s" begin="2.05s" fill="freeze"/>
 <text x="372" y="102" font-family="Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="#F0F6FC">FARUKHV</text>
 <rect x="650" y="58" width="15" height="51" rx="2" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
 <text x="374" y="137" font-family="monospace" font-size="15" fill="#22D3EE">COMPUTER ENGINEERING · BUILDING REAL SYSTEMS</text>
 <g clip-path="url(#c1)"><text x="374" y="180" font-family="monospace" font-size="19" fill="#D7E2EA">accessibility / AI / architecture / secure-by-design</text></g>
</g>

<g transform="translate(372 214)" opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="3.8s" fill="freeze"/>
 <rect width="708" height="48" rx="10" fill="#08131D" stroke="#1B4052"/>
 <text x="20" y="30" font-family="monospace" font-size="17" fill="#3FB950">farukhv@github:~$</text>
 <text x="224" y="30" font-family="monospace" font-size="17" fill="#E6EDF3">./build --for=real-people</text>
 <rect x="497" y="16" width="9" height="19" fill="#8B949E"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
</g>

<g stroke="#22D3EE" fill="none" opacity=".55">
 <circle cx="1080" cy="114" r="34"/><circle cx="1080" cy="114" r="58" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0 1080 114" to="360 1080 114" dur="14s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="114" r="8" fill="#3FB950" stroke="none"><animate attributeName="r" values="7;11;7" dur="1.8s" repeatCount="indefinite"/></circle>
 <path d="M1010 114H953M1150 114h31M1080 44V18M1080 184v27"/>
</g>
<text x="1037" y="205" font-family="monospace" font-size="10" fill="#708799">SYSTEM READY</text>
<rect x="0" y="296" width="350" height="1" fill="url(#g)"><animate attributeName="x" values="-350;1200" dur="5.5s" repeatCount="indefinite"/></rect>
</svg>