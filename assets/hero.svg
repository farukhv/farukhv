  <circle cx="238" cy="218" r="15" fill="#0D1117" stroke="#195B73"/>
  <circle cx="238" cy="218" r="7" fill="#3FB950" filter="url(#glow)"><animate attributeName="r" values="6;8;6" dur="1.8s" repeatCount="indefinite"/></circle>

