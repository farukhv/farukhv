<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">FARUKHV developer identity dashboard</title><desc id="desc">Muhammed Faruk Menek developer identity dashboard focused on software engineering, accessibility, AI and secure systems.</desc>
