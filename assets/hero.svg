<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FARUKHV developer identity dashboard</title>
  <desc id="desc">Software engineering, accessibility, artificial intelligence and secure systems profile dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#238636"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="avatarClip"><circle cx="160" cy="151" r="92"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1F6FEB" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#244258"/>
  <rect width="1200" height="420" rx="22" fill="url(#dots)"/>

