name: github metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Generate rich metrics when token is available
        if: ${{ env.METRICS_TOKEN != '' }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: farukhv
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Istanbul
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_ignored: html, css, tex, makefile, dockerfile, batchfile, powershell, roff
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, review, push, ref/create
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12
          config_order: base.header, languages, isocalendar, activity, topics

      - name: Keep built-in telemetry fallback
        if: ${{ env.METRICS_TOKEN == '' }}
        run: |
          echo "METRICS_TOKEN is not configured."
          echo "Using the committed github-metrics.svg fallback; workflow remains healthy."
