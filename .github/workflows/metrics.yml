name: github metrics

on:
  schedule:
    - cron: "0 6 * * *"          # her gün 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Zengin metrik kartını üret
        uses: lowlighter/metrics@latest
        with:
          # Settings > Secrets and variables > Actions > New repository secret
          # Ad: METRICS_TOKEN — Classic PAT, scope: repo + read:org + read:user
          token: ${{ secrets.METRICS_TOKEN }}
          user: farukhv
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Istanbul
          base: header, activity, community, repositories, metadata

          # ── Diller (son 12 ay, satır bazlı, sadece kod) ──
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_ignored: >-
            html, css, tex, makefile, dockerfile, batchfile, powershell, roff

          # ── Yıl haritası (3B izometrik takvim) ──
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ── Kodlama alışkanlıkları (saat/gün grafiği, olgular) ──
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # ── Son aktivite akışı ──
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, review, push, ref/create

          # ── Rozetler / başarımlar ──
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

          # ── Dikkat çeken katkılar + ilgi alanları ──
          plugin_notable: yes
          plugin_notable_types: commit
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 16

          # ── Takip / takipçi özeti ──
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

          # ── En aktif kod saatleri (repo istatistiklerinden) ──
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          config_order: >-
            base.header, languages, isocalendar, habits, activity,
            notable, topics, lines, achievements, followup
