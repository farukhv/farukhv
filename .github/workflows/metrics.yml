name: github metrics

on:
  schedule:
    - cron: "0 6 * * *"          # her gün 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Zengin metrik kartını üret
        uses: lowlighter/metrics@latest
        with:
          # Settings > Secrets and variables > Actions > New repository secret
          # Ad: METRICS_TOKEN  —  Classic PAT, scope: repo + read:org (+ read:user)
          token: ${{ secrets.METRICS_TOKEN }}
          user: farukhv
          filename: github-metrics.svg
          template: classic

          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Istanbul

          # Dil dağılımı (son 12 ay, satır bazlı, sadece kod)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_ignored: >-
            html, css, tex, makefile, dockerfile, shell, batchfile

          # Katkı takvimi (yıl haritası)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Son aktivite akışı
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, review, push

          # Rozetler / başarımlar
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

          # En dikkat çeken katkılar + ilgi alanları
          plugin_notable: yes
          plugin_notable_types: commit
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

          # Takipçi/takip özeti
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Görünüm
          config_order: base.header, languages, isocalendar, activity, notable, topics, achievements, followup
