name: generate snake animation

on:
  # Katkı grafiği değiştikçe güncellensin: 12 saatte bir
  schedule:
    - cron: "0 */12 * * *"
  # main'e her push'ta
  push:
    branches:
      - main
  # Actions sekmesinden elle tetikleme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yılan SVG'lerini üret
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF9C
            dist/github-contribution-grid-snake.gif

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
